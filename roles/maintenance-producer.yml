name: maintenance-producer
image: agent-in-docker
capabilities:
  # Sealed model: commit locally and hand off; the host integrates.
  file_read: true
  git_push: false
  user_prompt: true
  discover_agents: true
  message_agents: true
  gh_pr_create: false
  gh_pr_view: true

file_read_paths:
  - "${HOME}/.gitconfig"
  - "${HOME}/.ssh/config"
  - "/etc/hosts"

file_read_deny_paths:
  - "**/*.pem"
  - "**/*_rsa"
  - "**/*.key"
  - "**/credentials*"
  - "**/.env*"

git_push_remotes:
  - "origin"

message_agents_roles:
  - "planner"
  - "review-agent"
  - "feature-producer"
  - "maintenance-producer"
